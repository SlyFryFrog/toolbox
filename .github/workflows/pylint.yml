name: Validate Toolbox Scripts

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --dev

      - name: Gather scripts files
        id: files
        run: |
          echo "FILES=$(git ls-files 'scripts/**/*.py' | tr '\n' ' ')" >> $GITHUB_ENV

      - name: Lint with pylint
        run: |
          uv run --locked pylint $FILES

      - name: Check formatting with black
        run: |
          uv run --locked black --check $FILES

      - name: Check imports with isort
        run: |
          uv run --locked isort --check-only $FILES

      - name: Type check with mypy
        run: |
          uv run --locked mypy $FILES

      - name: Run copyright tests
        run: |
          uv run --locked python -m unittest discover \
            -s tests/copyright \
            -p 'test_tool.py' \
            -v
          uv run --locked toolbox-copyright \
            --config tests/copyright/mock/config.toml \
            --directory tests/copyright/mock \
            --check
