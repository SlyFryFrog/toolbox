name: Verify Copyright Headers

on:
  workflow_call:
    inputs:
      config:
        description: 'Toml config for the copyright tool'
        required: true
        type: string
      directory:
        description: 'Root directory to check recursively'
        required: true
        type: string

  workflow_dispatch:
    inputs:
      config:
        description: 'TOML config for the copyright tool'
        required: true
        default: 'tests/copyright/mock/config.toml'
        type: string
      directory:
        description: 'Root directory to check recursively'
        required: true
        default: 'tests/copyright/mock'
        type: string

permissions:
  contents: read

jobs:
  verify-copyright:
    name: Verify Copyright Headers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: source

      - name: Checkout toolbox repository
        uses: actions/checkout@v6
        with:
          repository: marcusgigandet/toolbox
          path: toolbox

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: toolbox/uv.lock

      - name: Verify copyright headers
        id: verify
        continue-on-error: true
        env:
          COPYRIGHT_CONFIG: ${{ github.workspace }}/source/${{ inputs.config }}
          COPYRIGHT_DIRECTORY: ${{ github.workspace }}/source/${{ inputs.directory }}
          TOOLBOX_PACKAGE: ${{ github.workspace }}/toolbox
        run: |
          set +e
          uvx --from "$TOOLBOX_PACKAGE" toolbox-copyright \
            --config "$COPYRIGHT_CONFIG" \
            --directory "$COPYRIGHT_DIRECTORY" \
            --check
          check_exit=$?
          echo "exit_code=$check_exit" >> "$GITHUB_OUTPUT"
          exit "$check_exit"

      - name: Show diff if violations found
        if: steps.verify.outputs.exit_code == '1'
        env:
          COPYRIGHT_CONFIG: ${{ github.workspace }}/source/${{ inputs.config }}
          COPYRIGHT_DIRECTORY: ${{ github.workspace }}/source/${{ inputs.directory }}
          TOOLBOX_PACKAGE: ${{ github.workspace }}/toolbox
        run: |
          echo "::error::Copyright header violations found"
          uvx --from "$TOOLBOX_PACKAGE" toolbox-copyright \
            --config "$COPYRIGHT_CONFIG" \
            --directory "$COPYRIGHT_DIRECTORY" \
            --fix || true
          git -C "${{ github.workspace }}/source" diff -- .

      - name: Fail verification
        if: always() && steps.verify.outcome == 'failure'
        run: exit 1
